<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>متجر الشحن الإلكتروني | Cyber Store</title>
    
    <!-- خط Tajawal من Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    
    <!-- مكتبة أيقونات FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- مكتبة تليجرام لتطبيقات الويب (Telegram WebApp SDK) -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151c2c;
            --accent-color: #00ff88;
            --accent-hover: #00cc6a;
            --text-color: #ffffff;
            --text-secondary: #94a3b8;
            --border-color: #2a354f;
            --danger-color: #ff4d4d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 15px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* الهيدر ورأس الصفحة */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 12px 18px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--accent-color);
            color: var(--bg-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .user-balance {
            background: rgba(0, 255, 136, 0.1);
            color: var(--accent-color);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid var(--accent-color);
            font-size: 14px;
            font-weight: 700;
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* شبكة التطبيقات والألعاب */
        .apps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 12px;
        }

        .app-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 15px 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .app-card:active {
            transform: scale(0.95);
        }

        .app-card.selected {
            border-color: var(--accent-color);
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.2);
        }

        .app-icon {
            font-size: 32px;
            color: var(--accent-color);
            margin-bottom: 8px;
        }

        .app-name {
            font-size: 13px;
            font-weight: 600;
        }

        /* قسم الشحن وتفاصيل الطلب */
        .charge-section {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-label {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .input-wrapper {
            display: flex;
            gap: 8px;
        }

        .custom-input {
            flex: 1;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px 15px;
            color: var(--text-color);
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        .custom-input:focus {
            border-color: var(--accent-color);
        }

        .btn-verify {
            background: var(--border-color);
            color: var(--text-color);
            border: none;
            padding: 0 15px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        .btn-verify:active {
            background: var(--accent-color);
            color: var(--bg-color);
        }

        /* شبكة الباقات */
        .packages-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .pkg-card {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .pkg-card.active {
            border-color: var(--accent-color);
            background: rgba(0, 255, 136, 0.05);
        }

        .pkg-title {
            font-size: 14px;
            font-weight: bold;
        }

        .pkg-price {
            font-size: 13px;
            color: var(--accent-color);
            margin-top: 4px;
        }

        /* زر الشحن الرئيسي */
        .btn-submit {
            background: var(--accent-color);
            color: var(--bg-color);
            border: none;
            border-radius: 12px;
            padding: 15px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 15px rgba(0, 255, 136, 0.3);
        }

        .btn-submit:active {
            background: var(--accent-hover);
            transform: scale(0.98);
        }

        .btn-submit:disabled {
            background: var(--border-color);
            color: var(--text-secondary);
            box-shadow: none;
            cursor: not-allowed;
        }

        /* الإشعارات التفاعلية (Toasts) */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--card-bg);
            border: 1px solid var(--accent-color);
            color: var(--text-color);
            padding: 12px 20px;
            border-radius: 25px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
            transition: transform 0.3s ease;
            z-index: 1000;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        .player-status {
            font-size: 12px;
            margin-top: 4px;
            display: none;
        }
        .player-status.success { color: var(--accent-color); display: block; }
        .player-status.error { color: var(--danger-color); display: block; }
    </style>
</head>
<body>

    <!-- الهيدر -->
    <div class="header">
        <div class="user-info">
            <div class="user-avatar" id="user-avatar">U</div>
            <div>
                <div style="font-size: 14px; font-weight: bold;" id="user-name">المستخدم</div>
                <div style="font-size: 11px; color: var(--text-secondary);">حساب مفعل</div>
            </div>
        </div>
        <div class="user-balance" id="user-balance">$50.00</div>
    </div>

    <!-- قسم اختيار التطبيقات -->
    <div>
        <div class="section-title">
            <i class="fa-solid fa-gamepad" style="color: var(--accent-color);"></i> اختر اللعبة أو التطبيق
        </div>
        <div class="apps-grid">
            <div class="app-card selected" onclick="selectApp(this, 'pubg')">
                <i class="fa-solid fa-crosshairs app-icon"></i>
                <div class="app-name">PUBG Mobile</div>
            </div>
            <div class="app-card" onclick="selectApp(this, 'freefire')">
                <i class="fa-solid fa-fire app-icon"></i>
                <div class="app-name">Free Fire</div>
            </div>
            <div class="app-card" onclick="selectApp(this, 'tiktok')">
                <i class="fa-brands fa-tiktok app-icon"></i>
                <div class="app-name">TikTok</div>
            </div>
            <div class="app-card" onclick="selectApp(this, 'yalla')">
                <i class="fa-solid fa-dice app-icon"></i>
                <div class="app-name">Yalla Ludo</div>
            </div>
        </div>
    </div>

    <!-- تفاصيل الشحن -->
    <div class="charge-section">
        <div class="input-group">
            <label class="input-label" id="id-label">معرف اللاعب (Player ID):</label>
            <div class="input-wrapper">
                <input type="number" class="custom-input" id="player-id" placeholder="أدخل رقم الـ ID هنا...">
                <button class="btn-verify" onclick="verifyPlayerId()">تحقق</button>
            </div>
            <div class="player-status" id="player-status"></div>
        </div>

        <div class="input-group">
            <label class="input-label">اختر الباقة المطلوبة:</label>
            <div class="packages-grid" id="packages-container">
                <!-- سيتم تحميل الباقات عبر JavaScript -->
            </div>
        </div>

        <button class="btn-submit" id="submit-btn" onclick="processOrder()">
            <i class="fa-solid fa-bolt"></i> إرسال طلب الشحن
        </button>
    </div>

    <!-- إشعار الاستجابة السريعة -->
    <div class="toast" id="toast">
        <i class="fa-solid fa-circle-check" style="color: var(--accent-color);"></i>
        <span id="toast-msg">تمت العملية بنجاح</span>
    </div>

    <script>
        // تهيئة Telegram WebApp
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand(); // ملء الشاشة
            
            // جلب بيانات المستخدم من تليجرام
            if (tg.initDataUnsafe?.user) {
                const user = tg.initDataUnsafe.user;
                document.getElementById('user-name').innerText = user.first_name;
                document.getElementById('user-avatar').innerText = user.first_name.charAt(0).toUpperCase();
            }
        }

        // بيانات الباقات التفاعلية لكل لعبة
        const appPackages = {
            pubg: [
                { id: 1, name: '60 UC', price: 0.99 },
                { id: 2, name: '325 UC', price: 4.99 },
                { id: 3, name: '660 UC', price: 9.99 },
                { id: 4, name: '1800 UC', price: 24.99 }
            ],
            freefire: [
                { id: 5, name: '100 جوهرة', price: 0.89 },
                { id: 6, name: '310 جوهرة', price: 2.99 },
                { id: 7, name: '520 جوهرة', price: 4.89 }
            ],
            tiktok: [
                { id: 8, name: '70 عملة', price: 0.95 },
                { id: 9, name: '350 عملة', price: 4.75 },
                { id: 10, name: '1400 عملة', price: 18.50 }
            ],
            yalla: [
                { id: 11, name: '40 كوينز', price: 0.99 },
                { id: 12, name: '220 كوينز', price: 4.99 }
            ]
        };

        let currentApp = 'pubg';
        let selectedPackage = null;

        // تحميل الباقات الأولية
        renderPackages('pubg');

        // التبديل بين التطبيقات
        function selectApp(element, appKey) {
            triggerHaptic();
            document.querySelectorAll('.app-card').forEach(card => card.classList.remove('selected'));
            element.classList.add('selected');
            
            currentApp = appKey;
            selectedPackage = null;
            
            // إعادة ضبط حالة التحقق من ID
            const statusEl = document.getElementById('player-status');
            statusEl.className = 'player-status';
            statusEl.innerText = '';
            document.getElementById('player-id').value = '';

            renderPackages(appKey);
        }

        // عرض باقات اللعبة المختارة
        function renderPackages(appKey) {
            const container = document.getElementById('packages-container');
            container.innerHTML = '';
            
            appPackages[appKey].forEach((pkg, index) => {
                const pkgEl = document.createElement('div');
                pkgEl.className = `pkg-card ${index === 0 ? 'active' : ''}`;
                pkgEl.onclick = () => selectPackage(pkgEl, pkg);
                pkgEl.innerHTML = `
                    <div class="pkg-title">${pkg.name}</div>
                    <div class="pkg-price">$${pkg.price.toFixed(2)}</div>
                `;
                container.appendChild(pkgEl);

                // اختيار الباقة الأولى تلقائياً
                if (index === 0) selectedPackage = pkg;
            });
        }

        // اختيار الباقة
        function selectPackage(element, pkg) {
            triggerHaptic();
            document.querySelectorAll('.pkg-card').forEach(card => card.classList.remove('active'));
            element.classList.add('active');
            selectedPackage = pkg;
        }

        // محاكاة زر التحقق من ID
        function verifyPlayerId() {
            triggerHaptic();
            const idInput = document.getElementById('player-id').value;
            const statusEl = document.getElementById('player-status');

            if (!idInput || idInput.length < 5) {
                statusEl.innerText = "❌ يرجى إدخال رقم ID صحيح (أكثر من 5 أرقام)";
                statusEl.className = 'player-status error';
                return;
            }

            statusEl.innerText = "⏳ جاري التحقق من الحساب...";
            statusEl.className = 'player-status';

            setTimeout(() => {
                statusEl.innerText = `✅ تم العثور على الحساب: Player_Cyber_${idInput.slice(-3)}`;
                statusEl.className = 'player-status success';
            }, 800);
        }

        // إرسال الطلب والاستجابة
        function processOrder() {
            triggerHaptic();
            const playerId = document.getElementById('player-id').value;

            if (!playerId) {
                showToast("⚠️ يرجى إدخال معرف اللاعب أولاً");
                return;
            }

            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> جاري معالجة الطلب...`;

            // تجهيز البيانات لإرسالها لتليجرام أو السيرفر
            const orderData = {
                app: currentApp,
                playerId: playerId,
                package: selectedPackage
            };

            setTimeout(() => {
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-bolt"></i> إرسال طلب الشحن`;
                showToast(`🚀 تم إرسال طلب شحن ${selectedPackage.name} بنجاح!`);

                // إرسال البيانات فورياً لبوت تليجرام عند إغلاق النافذة
                if (tg && tg.sendData) {
                    tg.sendData(JSON.stringify(orderData));
                }
            }, 1500);
        }

        // عرض تنبيه توست
        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // إعطاء اهتزاز خفيف للموبايل عند الضغط (إذا كان مدعوماً)
        function triggerHaptic() {
            if (tg && tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('light');
            }
        }
    </script>
</body>
</html>
